services:
  api:
    build:
      context: ./apps/api
      dockerfile: Dockerfile
    ports:
      - "${API_PORT:-8081}:8080"
    env_file:
      - ./apps/api/.env
    environment:
      - HANGA_DEBUG=true
      - HANGA_CORS_ORIGINS=["http://localhost:3000", "http://localhost:3001"]
    volumes:
      - ./apps/api/app:/app/app  # Hot-reload in dev
    command: uvicorn app.main:app --host 0.0.0.0 --port 8080 --reload

  web:
    build:
      context: ./apps/web
      dockerfile: Dockerfile
      args:
        # NEXT_PUBLIC_* is inlined at build time and called from the browser,
        # so it must point at the API's *host-published* port.
        NEXT_PUBLIC_API_URL: http://localhost:${API_PORT:-8081}/api/v1
    ports:
      - "${WEB_PORT:-3001}:3000"
    env_file:
      - ./apps/web/.env.local
    depends_on:
      - api
