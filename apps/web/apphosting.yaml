# Firebase App Hosting configuration for the Hanga PWA.
# Docs: https://firebase.google.com/docs/app-hosting/configure-yaml

runConfig:
  minInstances: 0
  maxInstances: 2
  concurrency: 80
  cpu: 1
  memoryMiB: 512

env:
  # Point at the Cloud Run API deployed per docs/DEPLOY.md step 2.
  - variable: NEXT_PUBLIC_API_URL
    value: https://hanga-api-REPLACE-REGION.a.run.app/api/v1
    availability: [BUILD, RUNTIME]

  # Pinned demo date for rehearsal runs (defaults to 2026-10-10 in code).
  - variable: NEXT_PUBLIC_DEMO_DATE
    value: "2026-10-10"
    availability: [BUILD, RUNTIME]

  # Firebase web app config — fill from Project settings → General → Your apps.
  - variable: NEXT_PUBLIC_FIREBASE_API_KEY
    value: ""
    availability: [RUNTIME]
  - variable: NEXT_PUBLIC_FIREBASE_AUTH_DOMAIN
    value: ""
    availability: [RUNTIME]
  - variable: NEXT_PUBLIC_FIREBASE_PROJECT_ID
    value: ""
    availability: [RUNTIME]
  - variable: NEXT_PUBLIC_FIREBASE_STORAGE_BUCKET
    value: ""
    availability: [RUNTIME]
  - variable: NEXT_PUBLIC_FIREBASE_MESSAGING_SENDER_ID
    value: ""
    availability: [RUNTIME]
  - variable: NEXT_PUBLIC_FIREBASE_APP_ID
    value: ""
    availability: [RUNTIME]
